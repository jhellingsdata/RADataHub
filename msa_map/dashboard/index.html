// ── Config ─────────────────────────────────────────────────────────────────
const DATA_PATH         = '../data/processed/msa_all_indicators.json';
const CA_GEOJSON_PATH   = '../data/processed/ca.geojson';
const LAD_GEOJSON_PATH  = '../data/processed/lad.geojson';
const DEFAULT_MSA_ID    = 'ynyca';
const TIERS             = ['Established', 'Existing', 'DPP'];
const CHARTS_PATH        = '../data/processed/charts';
const CHART_SPECS_PATH   = '../data/processed/chart_specs';

const fmtInt   = v => Math.round(v).toLocaleString('en-GB');
const fmtDec1  = v => v.toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

// Indicator table definitions, in display order, grouped by `group`.
// better: 'higher' | 'lower' | 'context' — drives delta colour + comparison wording.
// benchmarkKey/benchmarkValue → "vs England" column; omit when no benchmark exists (cell shows "Pending").
// rankKey looks up msa.ranks; omit to show "Pending" in the Rank column.
const INDICATOR_CONFIG = [
  {
    group: 'Snapshot', key: 'density_2024', label: 'Population density', sourceYear: 'ONS, mid-2024 estimate',
    unit: 'people per km²', format: fmtDec1, better: 'context',
    benchmarkKey: 'density_2024', rankKey: 'density_2024',
  },
  {
    group: 'Snapshot', key: 'rural_urban_score', label: 'Rural/urban score', sourceYear: 'ONS RUC 2021, mid-2024 population-weighted',
    unit: '0 = fully urban, 100 = fully rural', format: fmtDec1, better: 'context',
    benchmarkKey: 'rural_urban_score', rankKey: 'rural_urban_score',
    technicalNote: `
      <p>This score summarises how rural or urban an area is, based on the official ONS Rural Urban Classification (2021) of Output Areas — the smallest geography ONS publishes, each covering roughly 300 residents.</p>
      <p>Each Output Area is scored 0&ndash;100 based on its ONS classification (0 = urban, 100 = the most rural category), then combined up to MSA level weighted by where people actually live (ONS mid-2024 population estimates), not by land area.</p>
      <p>The &ldquo;Predominantly Rural&rdquo; / &ldquo;Predominantly Urban&rdquo; label compares an MSA's score against England's own population-weighted average (12.7) &mdash; not a strict &ldquo;over 50% of residents live somewhere rural&rdquo; rule, since no MSA in England actually meets that bar.</p>
      <p>Because the score is population-weighted, a large rural MSA containing one major city can still land as &ldquo;Predominantly Urban&rdquo; overall, since most of its residents live in that city.</p>
      <p class="tech-note-source">Source: ONS Rural Urban Classification 2021 &middot; ONS mid-2024 Small Area Population Estimates</p>
    `,
  },
  {
    group: 'Economy', key: 'gva_ph_2023', label: 'GVA per head', sourceYear: 'ONS, 2023',
    unit: '', format: v => '£' + fmtInt(v), better: 'higher',
    benchmarkKey: 'gva_ph_2023', rankKey: 'gva_ph_2023',
  },
  {
    group: 'Economy', key: 'gva_growth_2018_23', label: 'GVA growth 2018–23', sourceYear: 'ONS, 2018–2023',
    unit: '', format: v => fmtDec1(v) + '%', better: 'higher',
    benchmarkKey: 'gva_growth_2018_23', rankKey: 'gva_growth_2018_23',
  },
  {
    group: 'Deprivation', key: 'imd_pct_decile1', label: '% LSOAs most deprived 10%', sourceYear: 'MHCLG, IMD 2025',
    unit: '', format: v => fmtDec1(v) + '%', better: 'lower',
    benchmarkKey: 'imd_pct_decile1', rankKey: 'imd_pct_decile1',
  },
];

// ── State ──────────────────────────────────────────────────────────────────
let DATA = null;
let boundaryMap = null;
let boundaryLayer = null;
let cachedCaGeo = null, cachedLadGeo = null;

// ── Load ───────────────────────────────────────────────────────────────────
async function loadJSON(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`Failed to load ${path}: ${res.status}`);
  return res.json();
}

async function init() {
  try {
    DATA = await loadJSON(DATA_PATH);
  } catch (err) {
    console.error(err);
    alert(`Could not load ${DATA_PATH}.\n\nRun "python scripts/build_dashboard_data.py" first, then reload via Live Server.`);
    return;
  }

  populateDropdown();

  const select = document.getElementById('msa-select');
  select.addEventListener('change', e => renderProfile(e.target.value));

  const requestedId = new URLSearchParams(window.location.search).get('msa');
  const defaultMsa = DATA.msas.find(m => m.id === requestedId)
                   || DATA.msas.find(m => m.id === DEFAULT_MSA_ID)
                   || DATA.msas[0];
  select.value = defaultMsa.id;
  renderProfile(defaultMsa.id);
}

function populateDropdown() {
  const select = document.getElementById('msa-select');
  TIERS.forEach(tier => {
    const group = document.createElement('optgroup');
    group.label = tier;
    DATA.msas.filter(m => m.tier === tier).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      group.appendChild(opt);
    });
    select.appendChild(group);
  });
}

// ── Render: profile (fade transition) ───────────────────────────────────────
function renderProfile(id) {
  const msa = DATA.msas.find(m => m.id === id);
  if (!msa) return;
  const content = document.getElementById('content');
  content.classList.add('fading');
  setTimeout(() => {
    renderAuthorityHeader(msa);
    renderIndicatorTable(msa);
    renderBoundaryMap(msa);
    renderDeepDive(msa);

    content.classList.remove('fading');
  }, 180);
}

// ── Render: authority header ─────────────────────────────────────────────────
function renderAuthorityHeader(msa) {
  document.getElementById('breadcrumb').textContent = `England · ${msa.gss_code} · ${msa.tier}`;
  document.getElementById('authority-name').textContent = msa.name;

  const pill = document.getElementById('tier-pill');
  pill.textContent = msa.tier;
  pill.className = `tier-pill tier-${msa.tier.toLowerCase()}`;

  const parts = [
    `Mayor: ${msa.mayor}`,
    `Established: ${msa.established}`,
    `Deal Level: ${msa.deal_level}`,
    `Area: ${msa.area_km2.toLocaleString('en-GB')} km²`,
  ];
  const pop = msa.indicators.pop_2024;
  if (pop !== null && pop !== undefined) parts.push(`Population: ${fmtInt(pop)}`);
  if (msa.rural_urban_tag) parts.push(msa.rural_urban_tag);
  let html = parts
    .map(p => `<span>${p}</span>`)
    .join('<span class="meta-sep">·</span>');
  if (msa.website) {
    html += `<span class="meta-sep">·</span><a href="${msa.website}" target="_blank" rel="noopener">Website</a>`;
  }
  document.getElementById('meta-row').innerHTML = html;
}

// ── Render: indicator table ──────────────────────────────────────────────────
function renderIndicatorTable(msa) {
  const container = document.getElementById('indicators-sections');
  container.innerHTML = '';
  const benchmarks = DATA.metadata.england_benchmarks;

  const table = document.createElement('table');
  table.id = 'indicator-table';
  table.innerHTML = `
    <thead>
      <tr>
        <th class="col-indicator">Indicator</th>
        <th class="col-latest">Latest</th>
        <th class="col-vs-england">vs England</th>
        <th class="col-rank">Rank in MSAs</th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement('tbody');
  let currentGroup = null;

  INDICATOR_CONFIG.forEach(cfg => {
    if (cfg.group !== currentGroup) {
      currentGroup = cfg.group;
      const groupRow = document.createElement('tr');
      groupRow.className = 'group-row';
      groupRow.innerHTML = `<td colspan="4">${cfg.group}</td>`;
      tbody.appendChild(groupRow);
    }

    const value = msa.indicators[cfg.key];
    const row = document.createElement('tr');
    row.className = 'indicator-row';

    if (value === null || value === undefined) {
      row.innerHTML = `
        <td class="cell-indicator">
          <div class="ind-name">${cfg.label}</div>
          <div class="ind-source">${cfg.sourceYear}</div>
        </td>
        <td colspan="3"><span class="pending">Pending</span></td>
      `;
      tbody.appendChild(row);
      return;
    }

    // LATEST
    const latestHtml = `
      <span class="latest-value">${cfg.format(value)}</span>
      ${cfg.unit ? `<div class="latest-unit">${cfg.unit}</div>` : ''}
    `;

    // VS ENGLAND
    const benchmark = cfg.benchmarkKey ? benchmarks[cfg.benchmarkKey]
                     : (cfg.benchmarkValue !== undefined ? cfg.benchmarkValue : null);
    let vsEnglandHtml = `<span class="pending">Pending</span>`;
    if (benchmark !== null && benchmark !== undefined) {
      const diff     = ((value - benchmark) / benchmark) * 100;
      const diffAbs  = fmtDec1(Math.abs(diff));
      const sign     = diff >= 0 ? '+' : '−';
      const aboveBelow = diff >= 0 ? 'above' : 'below';
      let colourClass = 'neutral';
      if (cfg.better === 'higher') colourClass = diff >= 0 ? 'pos' : 'neg';
      else if (cfg.better === 'lower') colourClass = diff <= 0 ? 'pos' : 'neg';
      vsEnglandHtml = `
        <span class="delta ${colourClass}">${sign}${diffAbs}%</span>
        <div class="sub-line">${aboveBelow} England (${cfg.format(benchmark)})</div>
      `;
    }

    // RANK
    const rank = cfg.rankKey ? msa.ranks[cfg.rankKey] : null;
    const rankHtml = (rank !== null && rank !== undefined)
      ? `<span class="rank-num">${rank}</span><span class="rank-denom"> / 20</span>`
      : `<span class="pending">Pending</span>`;

    const technicalNoteHtml = cfg.technicalNote ? `
      <details class="tech-note">
        <summary>How is this calculated?</summary>
        <div class="tech-note-body">${cfg.technicalNote}</div>
      </details>
    ` : '';

    row.innerHTML = `
      <td class="cell-indicator">
        <div class="ind-name">${cfg.label}</div>
        <div class="ind-source">${cfg.sourceYear}</div>
        ${technicalNoteHtml}
      </td>
      <td class="cell-latest">${latestHtml}</td>
      <td class="cell-vs-england">${vsEnglandHtml}</td>
      <td class="cell-rank">${rankHtml}</td>
    `;
    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  container.appendChild(table);
}

const YORK_COLOR = '#2A9D8F';
const NORTH_YORKS_COLOR = '#E8A84A';

// One shared Vega-Lite config so every chart matches the site's type system.
// Deliberately does NOT touch `range` (category/diverging/etc.) — each spec's
// own meaningful colour scales (IMD red/blue, tier colours, gain/drain, the
// York/North Yorkshire pairing) are set explicitly in its encoding and are
// left alone, per the brief.
const SITE_VEGA_CONFIG = {
  font: 'Inter, Arial, sans-serif',
  background: 'transparent',
  title: {
    font: "'Playfair Display', serif",
    fontSize: 14,
    fontWeight: 700,
    subtitleFont: 'Inter, Arial, sans-serif',
    subtitleFontSize: 10.5,
    color: '#1A1A1A',
    subtitleColor: '#6B6B6B',
    anchor: 'start',
  },
  axis: {
    labelFont: 'Inter, Arial, sans-serif',
    titleFont: 'Inter, Arial, sans-serif',
    labelColor: '#6B6B6B',
    titleColor: '#6B6B6B',
    labelFontSize: 11,
    titleFontSize: 12,
    gridColor: '#E8E7E2',
    domainColor: '#E8E7E2',
    tickColor: '#E8E7E2',
  },
  legend: {
    labelFont: 'Inter, Arial, sans-serif',
    titleFont: 'Inter, Arial, sans-serif',
    labelColor: '#6B6B6B',
    titleColor: '#6B6B6B',
    labelFontSize: 11,
  },
  view: { stroke: null },
};

const VEGA_EMBED_OPTS = {
  actions: { export: true, source: false, compiled: false, editor: false },
  renderer: 'svg',
  config: SITE_VEGA_CONFIG,
};

const specCache = {};
async function loadSpec(name) {
  if (!specCache[name]) {
    specCache[name] = loadJSON(`${CHART_SPECS_PATH}/${name}.json`);
  }
  return specCache[name];
}

// Embeds one chart panel: { spec: 'file_basename' } for an interactive
// Vega-Lite chart, or { png: 'file_basename' } for a static fallback image.
async function embedChartPanel(containerId, panel) {
  const el = document.getElementById(containerId);
  if (!el) return;

  if (panel.png) {
    el.innerHTML = `<img src="${CHARTS_PATH}/${panel.png}.png" alt="${panel.alt || ''}" loading="lazy" />`;
    return;
  }

  el.classList.add('is-loading');
  try {
    const rawSpec = await loadSpec(panel.spec);
    const spec = JSON.parse(JSON.stringify(rawSpec)); // clone — don't mutate the cached spec
    delete spec.config; // site config (below) fully replaces the spec's own baked-in theme
    // c6_imd_domain_table is a hand-built "table" of literal mark_text/mark_rect
    // positions computed in pixels against its original fixed width (it isn't a
    // real encoding-driven layout) — stretching it to the container breaks the
    // column alignment, so it keeps its authored width instead.
    if (!panel.fixedWidth) spec.width = 'container';
    await vegaEmbed(`#${containerId}`, spec, VEGA_EMBED_OPTS);
  } catch (err) {
    console.error(`Chart embed failed for ${containerId} (${panel.spec}):`, err);
    el.innerHTML = `<span class="pending">Chart could not be loaded.</span>`;
  } finally {
    el.classList.remove('is-loading');
  }
}

      <p>ONS publishes no GVA figure for Combined Authorities. It publishes at ITL3 level — sub-regional units at roughly county / large-district scale (e.g. one ITL3 covers West Yorkshire, but Greater Manchester splits into five).</p>
      <p>GVA per head, per MSA: identify the ITL3s that fall within each MSA boundary, take each ITL3's GVA per head from ONS Table 2 (Regional GVA Balanced), then average across ITL3s weighted by population, so larger ITL3s count proportionally more.</p>
      <p>Total GVA: no official MSA figure exists, so it is approximated as GVA per head × mid-2023 population — order-of-magnitude only, and flagged as indicative on the chart. The indexed growth series (2013 = 100) is the cleaner comparison.</p>
      <p>Some ITL3s straddle two MSAs; each is assigned to the MSA it most overlaps.</p>
    `,
  },
  t5: {
    title: 'How the brain-gain rate is built',
    body: `
      <p>Per town: graduates arriving minus graduates leaving, scaled to a headcount gained/lost; summed across an MSA's towns and divided by the MSA's total graduate cohort — so larger graduate towns weigh more than small market towns. (Formula: Σ net graduates gained/lost ÷ Σ total graduates.)</p>
      <p>Source: ONS Graduate Retention Study — a GCSE cohort tracked from 2008–11 to where they lived in 2018–19, across England's 1,104 built-up areas.</p>
      <p>University cities can exceed +100% because they attract far more graduates than their own local cohort ever produced.</p>
      <p>Caveats: pre-Covid, pre-remote-work cohort. Suppressed (very small) towns are excluded; they tend to be slightly higher-drain, biasing MSA rates a touch upward. The West of England's +77% is genuine but reflects three co-located university cities in a compact geography.</p>
    `,
  },
  t6: {
    title: 'York’s pull, and the robustness check',
    body: `
      <p>York in detail: inward rate 44.7% (attracts graduates equal to 44.7% of its own local cohort); retention 61.0% (share of York-origin graduates who end up living in York); net gain +1.034 (the only YNYCA town with a positive net graduate gain); non-mover retention 76.6% (of those who didn't leave for university, 76.6% stayed).</p>
      <p>The dot plot removes each MSA's single dominant university city. Some MSAs keep other university towns (e.g. Greater Manchester keeps Salford, West Yorkshire keeps Huddersfield), so open dots are not pure non-university rates — except YNYCA, where York is the sole university town.</p>
      <p>Robustness: excluding every university-flagged town, Greater Manchester, West Yorkshire, Cambridgeshire & Peterborough and the North East cluster tightly at −10% to −11%; YNYCA's hinterland sits at −26%, more than twice as negative. York's dominance holds either way. (West of England is not comparable here — only 22% of its graduates are in non-university towns.)</p>
    `,
  },
  t7: {
    title: 'Reading the town-level picture',
    body: `
      <p>True MSA-level retention is probably higher than the town view suggests: York's large inward rate partly catches YNYCA graduates relocating internally to the economic centre, not only arrivals from outside the MSA.</p>
      <p>Catterick Garrison (53%) and Richmond (44%) are military / isolated towns that pull the mean up.</p>
    `,
  },
};

function renderDeepDive(msa) {
  const container = document.getElementById('deep-dive-section');
  container.innerHTML = '';
  if (msa.id !== 'ynyca') return;

  const embedQueue = [];
  let chartCounter = 0;

  YNYCA_STORY.forEach((block, blockIdx) => {
    const section = document.createElement('div');
    section.className = 'story-block' + (block.level === 2 ? ' sub' : '');
    section.dataset.c = block.c;

    const headingTag = block.level === 1 ? 'h2' : 'h3';
    const reverse = block.level === 1 ? (blockIdx % 2 === 1) : (blockIdx % 2 === 0);

    const chartWraps = block.charts.map(panel => {
      const id = `story-chart-${chartCounter++}`;
      embedQueue.push({ id, panel });
      return `
        <div class="profile-chart-wrap">
          <div id="${id}" class="vega-chart-embed"></div>
          ${panel.caption ? `<div class="profile-caption">${panel.caption}</div>` : ''}
        </div>
      `;
    }).join('');

    const techBox = block.tech ? YNYCA_TECH_BOXES[block.tech] : null;
    const techBoxHtml = techBox ? `
      <details class="tech-note story-tech-note" data-t="${block.tech}">
        <summary>Method &amp; detail — ${techBox.title}</summary>
        <div class="tech-note-body">${techBox.body}</div>
      </details>
    ` : '';

    section.innerHTML = `
      <div class="story-heading">
        <span class="story-num">${block.num}</span>
        <${headingTag}>${block.title}</${headingTag}>
      </div>
      <div class="profile-section${reverse ? ' reverse' : ''}${block.stacked ? ' stacked' : ''}">
        <div class="profile-text">
          <p class="profile-insight">${block.text}</p>
        </div>
        <div class="profile-charts">
          <div class="chart-row">${chartWraps}</div>
          <div class="profile-caption">Source: ${block.source}</div>
        </div>
      </div>
      ${techBoxHtml}
    `;
    container.appendChild(section);
  });

  // Embed after the DOM nodes exist, in parallel.
  embedQueue.forEach(({ id, panel }) => embedChartPanel(id, panel));
}

// ── Render: boundary map ────────────────────────────────────────────────────
// MSA boundary layer style — visible on satellite imagery (white dashed border,
// light teal fill so the imagery shows through, rather than the solid fill used
// when the basemap was just a flat grey England silhouette).
const msaStyle = {
  color:       '#FFFFFF',
  weight:       2.5,
  opacity:      1,
  fillColor:   '#2A9D8F',
  fillOpacity:  0.15,
  dashArray:   '6, 4',
};

async function renderBoundaryMap(msa) {
  const captionEl = document.getElementById('map-caption');

  if (!boundaryMap) {
    boundaryMap = L.map('boundary-map', {
      attributionControl: true,
      zoomControl: true,
    });

    // Layer 1 — satellite imagery base
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
        maxZoom: 18,
      }
    ).addTo(boundaryMap);

    // Layer 2 — roads, place names and boundaries (transparent overlay)
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: '',
        maxZoom: 18,
        opacity: 1,
      }
    ).addTo(boundaryMap);
  }

  if (boundaryLayer) { boundaryMap.removeLayer(boundaryLayer); boundaryLayer = null; }

  try {
    let targetLayer;
    if (msa.gss_code === 'TBC') {
      captionEl.textContent = 'Boundary not yet statutory — approximate boundary shown using constituent local authorities.';

      if (!cachedLadGeo) cachedLadGeo = await loadJSON(LAD_GEOJSON_PATH);
      const codes = new Set(msa.constituent_lad_codes || []);
      targetLayer = L.geoJSON(cachedLadGeo, {
        filter: f => codes.has(f.properties.LAD25CD),
        style: msaStyle,
      }).addTo(boundaryMap);
    } else {
      captionEl.textContent = 'Statutory boundary — ONS Combined Authorities (December 2025).';

      if (!cachedCaGeo) cachedCaGeo = await loadJSON(CA_GEOJSON_PATH);
      targetLayer = L.geoJSON(cachedCaGeo, {
        filter: f => f.properties.CAUTH25CD === msa.gss_code,
        style: msaStyle,
      }).addTo(boundaryMap);
    }

    boundaryLayer = targetLayer;
    const bounds = targetLayer.getBounds();
    if (bounds.isValid()) {
      boundaryMap.fitBounds(bounds, { padding: [20, 20] });
    } else {
      boundaryMap.setView([53.0, -1.5], 6);
    }
  } catch (err) {
    console.error('Boundary map load error:', err);
  }

  // Container may have been laid out after Leaflet measured it (e.g. first paint) — re-measure.
  setTimeout(() => boundaryMap.invalidateSize(), 200);
}

// ── Go ─────────────────────────────────────────────────────────────────────
init();
</script>
